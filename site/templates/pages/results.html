<div class="page-title"><div><h1>Results</h1><p>Every bet you placed, newest first.</p></div></div>
<section class="panel">
  <div class="ph"><div><h2>Your balance</h2><p>Your balance after each bet you placed was settled.</p></div></div>
  <div id="chart"><p class="empty">Loading…</p></div>
</section>
<section class="panel">
  <div class="ph">
    <div><h2 id="logTitle">Your bets</h2></div>
    <div class="filters">
      <label class="k showall"><input type="checkbox" id="fAll"> Show every pick posted</label>
      <select id="fSport" aria-label="Filter by sport" hidden><option value="">All sports</option></select>
      <select id="fStatus" aria-label="Filter by result">
        <option value="">All results</option><option value="pending">Pending</option><option value="won">Won</option>
        <option value="lost">Lost</option><option value="push">Push</option><option value="void">Void</option>
      </select>
    </div>
  </div>
  <div class="plist" id="log"><p class="empty" style="padding-top:12px">Loading…</p></div>
</section>
